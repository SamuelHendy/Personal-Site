openapi: 3.0.3
info:
  title: Personal Site API
  version: 1.0.0
  description: |
    Public and admin API contract for the Personal Site. This specification documents
    the intended responses and semantic intent for the Lambda-backed API layer.
servers:
  - url: http://localhost:5000
    description: Local Flask dev server
  - url: https://samhendy.com/api
    description: Production API gateway path
paths:
  /health:
    get:
      summary: Health check
      description: Used for smoke tests and infra health checks.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: healthy

  /albums:
    get:
      summary: List visible albums
      description: Returns album cards and optional pagination cursor.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 30
            maximum: 100
        - in: query
          name: cursor
          schema:
            type: string
            description: Pagination cursor returned by a prior response.
      responses:
        '200':
          description: Albums returned successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - albums
                properties:
                  albums:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlbumCard'
                  nextCursor:
                    type: string
                    nullable: true

  /albums/{album_name}:
    get:
      summary: Get images for one album
      description: Returns either an image array or an object with thumbnail + images when include_thumbnail=true.
      parameters:
        - in: path
          name: album_name
          required: true
          schema:
            type: string
        - in: query
          name: include_thumbnail
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Album images returned successfully.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: string
                  - $ref: '#/components/schemas/AlbumImages'
        '404':
          description: Album not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /recently-updated:
    get:
      summary: Recently updated albums
      description: Returns up to the most recently updated visible albums.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: Recent album list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlbumCard'

  /watches:
    get:
      summary: List enabled watches
      description: Returns compact card view for enabled watches, including thumbnail key.
      responses:
        '200':
          description: Watch cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchCard'

  /watches/{brand}/{model}:
    get:
      summary: Fetch full watch details
      description: Returns the full record plus hero, thumbnail, and image arrays.
      parameters:
        - in: path
          name: brand
          required: true
          schema:
            type: string
        - in: path
          name: model
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Watch details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchDetail'
        '404':
          description: Watch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fishtank/residents:
    get:
      summary: List fish or plant residents
      description: Returns resident records associated with the selected type.
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [fish, plant]
      responses:
        '200':
          description: Resident list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FishResident'
        '400':
          description: Invalid resident type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fishtank/timeline:
    get:
      summary: List fish tank timeline events
      description: Returns timeline events sorted chronologically and includes image arrays.
      responses:
        '200':
          description: Timeline events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEvent'

  /fishtank/hero:
    get:
      summary: Fetch hero image metadata
      description: Public hero data for the fish tank landing page.
      responses:
        '200':
          description: Hero asset.
          content:
            application/json:
              schema:
                type: object

  /admin/metrics:
    get:
      summary: Dashboard analytics
      description: Returns summary or detailed metrics for admin dashboard analytics.
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [summary, traffic, pages, social, api, api-errors]
            default: summary
        - in: query
          name: days
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: Metric payload.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MetricsSummary'
                  - type: array
                    items:
                      type: object
                  - type: object
        '400':
          description: Unknown metric type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Watch not found

    AlbumCard:
      type: object
      required:
        - name
        - thumbnail
        - img_count
        - last_updated
      properties:
        name:
          type: string
          example: Flowers
        display_name:
          type: string
          nullable: true
          example: Flowers
        thumbnail:
          type: string
          example: Flowers/thumbnail.jpg
        img_count:
          type: integer
          example: 12
        last_updated:
          type: string
          example: 2025-01-03

    AlbumImages:
      type: object
      properties:
        Thumbnail:
          type: string
          nullable: true
        Images:
          type: array
          items:
            type: string

    WatchCard:
      type: object
      additionalProperties: true
      properties:
        Brand:
          type: string
        Model:
          type: string
        Thumbnail:
          type: string
          nullable: true

    WatchDetail:
      type: object
      additionalProperties: true
      properties:
        Brand:
          type: string
        Model:
          type: string
        Images:
          type: array
          items:
            type: string
        Hero:
          type: string
          nullable: true
        Thumbnail:
          type: string
          nullable: true

    FishResident:
      type: object
      additionalProperties: true
      properties:
        Type:
          type: string
        Id:
          type: string
        Images:
          type: array
          items:
            type: string

    TimelineEvent:
      type: object
      additionalProperties: true
      properties:
        Id:
          type: string
        Date:
          type: string
        Images:
          type: array
          items:
            type: string

    MetricsSummary:
      type: object
      required:
        - pageViews
        - uniqueVisitors
        - errors24h
        - avgResponseMs
      properties:
        pageViews:
          type: integer
        uniqueVisitors:
          type: integer
        errors24h:
          type: integer
        avgResponseMs:
          type: number
          format: float
