name: Terraform Manual

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
      run_id:
        description: 'Run ID to apply from (required for apply, leave empty for plan)'
        required: false
        type: string

env:
  TERRAFORM_VERSION: "1.14.5"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: "eu-west-2"

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  plan:
    if: ${{ inputs.action == 'plan' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHub-OIDC-TERRAFORM-PLAN
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -no-color -out=tfplan
          echo "Plan created. Run ID: ${{ github.run_id }}"
          echo "To apply this plan, run this workflow again with:"
          echo "  action: apply"
          echo "  run_id: ${{ github.run_id }}"

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: terraform/tfplan
          retention-days: 7

  apply:
    if: ${{ inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate run_id
        if: inputs.run_id == ''
        run: |
          echo "Error: run_id is required for apply action"
          echo "First run a plan, then use that run_id to apply"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHub-OIDC-TERRAFORM-APPLY
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.run_id }}
          path: terraform
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false -no-color tfplan

      - name: Show Outputs
        working-directory: terraform
        run: terraform output
