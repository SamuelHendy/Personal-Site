name: Terraform Plan (Reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number'
        type: string
        required: true
    secrets:
      AWS_ROLE_ARN:
        description: 'AWS Role ARN for OIDC'
        required: true

env:
  TERRAFORM_VERSION: "1.14.5"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: "eu-west-2"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform_plan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHub-OIDC-TERRAFORM-PLAN
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        id: fmt
        working-directory: terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        id: validate
        working-directory: terraform
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Generate Plan Output
        id: show
        working-directory: terraform
        run: |
          terraform show -no-color tfplan > tf_show_output.txt
          PLAN_SIZE=$(wc -c < tf_show_output.txt)
          echo "plan-size=$PLAN_SIZE" >> $GITHUB_OUTPUT
          
          PLAN_SUMMARY=$(grep -E "^(Plan:|No changes)" tf_show_output.txt | tail -1 || echo "Plan summary not found")
          echo "plan-summary<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          if [ $PLAN_SIZE -gt 61440 ]; then
            echo "plan-too-large=true" >> $GITHUB_OUTPUT
          else
            echo "plan-too-large=false" >> $GITHUB_OUTPUT
            echo "stdout<<EOF" >> $GITHUB_OUTPUT
            cat tf_show_output.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pr_number }}-tf-plan
          path: terraform/tfplan

      - name: Upload Plan Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pr_number }}-terraform-show-output
          path: terraform/tf_show_output.txt

      - name: Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: ${{ steps.show.outputs.plan-too-large == 'false' && steps.show.outputs.stdout || '' }}
          PLAN_TOO_LARGE: ${{ steps.show.outputs.plan-too-large }}
          PLAN_SIZE: ${{ steps.show.outputs.plan-size }}
          PLAN_SUMMARY: ${{ steps.show.outputs.plan-summary }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style')
            })

            const planTooLarge = process.env.PLAN_TOO_LARGE === 'true';
            const planSize = process.env.PLAN_SIZE;
            const planSummary = process.env.PLAN_SUMMARY;
            
            let planSection;
            if (planTooLarge) {
              planSection = `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            **${planSummary}**

            ⚠️ **Plan output is too large** (${planSize} bytes) to display in this comment.
            
            📥 **Download the full plan output:**
            - Go to the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Download the \`${{ inputs.pr_number }}-terraform-show-output\` artifact`;
            } else {
              planSection = `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>`;
            }

            const output = `#### Terraform Format and Style 🖌 \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖 \`${{ steps.validate.outcome }}\`

            ${planSection}

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
