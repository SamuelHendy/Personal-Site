name: Deploy

on:
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  id-token: write
  contents: read
  pull-requests: read
  actions: read

env:
  AWS_REGION: "eu-west-2"

jobs:
  check-labels:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      deploy-frontend: ${{ steps.check.outputs.deploy-frontend }}
      deploy-backend: ${{ steps.check.outputs.deploy-backend }}
      deploy-terraform: ${{ steps.check.outputs.deploy-terraform }}
      deploy-admin: ${{ steps.check.outputs.deploy-admin }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PR labels
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Reading PR labels for deployment..."
          echo "PR Number: ${{ github.event.pull_request.number }}"
          
          CURRENT_LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name' | tr '\n' ' ' || echo "")
          echo "Current labels: $CURRENT_LABELS"
          
          if echo "$CURRENT_LABELS" | grep -q "deploy-frontend"; then
            echo "🚀 Frontend deployment label found"
            echo "deploy-frontend=true" >> $GITHUB_OUTPUT
          else
            echo "deploy-frontend=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CURRENT_LABELS" | grep -q "deploy-backend"; then
            echo "🚀 Backend deployment label found"
            echo "deploy-backend=true" >> $GITHUB_OUTPUT
          else
            echo "deploy-backend=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CURRENT_LABELS" | grep -q "deploy-terraform"; then
            echo "🚀 Terraform deployment label found"
            echo "deploy-terraform=true" >> $GITHUB_OUTPUT
          else
            echo "deploy-terraform=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CURRENT_LABELS" | grep -q "deploy-admin"; then
            echo "🚀 Admin deployment label found"
            echo "deploy-admin=true" >> $GITHUB_OUTPUT
          else
            echo "deploy-admin=false" >> $GITHUB_OUTPUT
          fi

  deploy-terraform:
    needs: check-labels
    if: needs.check-labels.outputs.deploy-terraform == 'true'
    uses: ./.github/workflows/terraform_apply.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_head_ref: ${{ github.event.pull_request.head.ref }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

  deploy-backend:
    needs: [check-labels, deploy-terraform]
    if: |
      always() &&
      needs.check-labels.outputs.deploy-backend == 'true' &&
      (needs.deploy-terraform.result == 'success' || needs.deploy-terraform.result == 'skipped')
    uses: ./.github/workflows/deploy_backend.yml
    secrets:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

  deploy-frontend:
    needs: [check-labels, deploy-terraform]
    if: |
      always() &&
      needs.check-labels.outputs.deploy-frontend == 'true' &&
      (needs.deploy-terraform.result == 'success' || needs.deploy-terraform.result == 'skipped')
    uses: ./.github/workflows/deploy_frontend.yml
    with:
      ui_bucket_name: ${{ vars.UI_BUCKET_NAME }}
      cloudfront_distribution_id: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    secrets:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

  deploy-admin:
    needs: [check-labels, deploy-terraform]
    if: |
      always() &&
      needs.check-labels.outputs.deploy-admin == 'true' &&
      (needs.deploy-terraform.result == 'success' || needs.deploy-terraform.result == 'skipped')
    uses: ./.github/workflows/deploy_admin.yml
    with:
      admin_bucket_name: ${{ vars.ADMIN_BUCKET_NAME }}
      cloudfront_distribution_id: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    secrets:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
